<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shoe Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:#0c0c0e; --surface:#141418; --surface2:#1c1c22;
      --border:#2a2a32; --text:#f0f0f0; --muted:#666; --orange:#FC4C02;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'Helvetica Neue',Arial,sans-serif; padding:40px 32px; min-height:100vh; }
    .header { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:48px; flex-wrap:wrap; gap:16px; }
    .header-left h1 { font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
    .header-left h2 { font-size:36px; font-weight:300; letter-spacing:-0.5px; }
    .header-left h2 span { color:var(--orange); font-weight:700; }
    .header-right { display:flex; gap:32px; }
    .stat { text-align:right; }
    .stat-val { font-size:28px; font-weight:700; line-height:1; }
    .stat-label { font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-top:4px; }
    .generated { font-size:11px; color:var(--muted); }
    .section-title { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:20px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:14px; margin-bottom:48px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; position:relative; overflow:hidden; transition:border-color 0.2s, transform 0.15s; cursor:pointer; }
    .card:hover { border-color:#3a3a44; transform:translateY(-2px); }
    .card.retired { opacity:0.55; }
    .card.warning { border-color:#f59e0b55; }
    .card-accent { position:absolute; top:0; left:0; right:0; height:6px; border-radius:14px 14px 0 0; }
    .card-tag { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
    .card-model { font-size:13px; font-weight:600; margin-bottom:3px; line-height:1.3; }
    .card-km { font-size:30px; font-weight:700; line-height:1; margin-bottom:3px; }
    .card-runs { font-size:11px; color:var(--muted); margin-bottom:14px; }
    .card-stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
    .mini-stat { background:var(--surface2); border-radius:8px; padding:8px 10px; }
    .mini-stat-val { font-size:15px; font-weight:700; line-height:1; margin-bottom:2px; }
    .mini-stat-label { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
    .card-retire { font-size:11px; color:var(--muted); margin-bottom:12px; }
    .card-retire span { font-weight:600; color:var(--text); }
    .life-track { background:var(--surface2); border-radius:99px; height:5px; overflow:hidden; }
    .life-fill { height:5px; border-radius:99px; }
    .life-label { font-size:10px; color:var(--muted); margin-top:6px; display:flex; justify-content:space-between; }
    .warning-badge { margin-top:10px; font-size:10px; color:#f59e0b; letter-spacing:0.5px; }
    .retired-badge { margin-top:10px; font-size:10px; color:var(--muted); letter-spacing:0.5px; }
    .idle-badge    { margin-top:10px; font-size:10px; color:#60a5fa; letter-spacing:0.5px; }
    .target-input-wrap { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); }
    .target-input-wrap input { width:52px; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:3px 8px; font-size:12px; font-family:inherit; text-align:right; outline:none; }
    .target-input-wrap input:focus { border-color:#3a3a44; }
    .card-alloc { font-size:10px; color:var(--muted); margin-top:3px; letter-spacing:0.3px; }
    .card-pts { font-size:11px; color:#FBBF24; margin-top:5px; font-weight:600; }
    .card-shoe-img { margin:-20px -20px 16px; padding-top:6px; height:130px; overflow:hidden; }
    .card-shoe-img img { width:100%; height:100%; object-fit:contain; padding:10px 20px; }
    .sort-bar { display:flex; gap:6px; }
    .sort-btn { background:none; border:1px solid var(--border); color:var(--muted); font-size:10px; letter-spacing:1px; text-transform:uppercase; padding:4px 10px; border-radius:6px; cursor:pointer; font-family:inherit; transition:color 0.15s, border-color 0.15s; }
    .sort-btn.active, .sort-btn:hover { color:var(--text); border-color:#3a3a44; }
    .overlay-pts { margin-top:32px; }
    .overlay-pts h3 { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:16px; }
    .pts-total { font-size:32px; font-weight:700; color:#FBBF24; line-height:1; margin-bottom:16px; }
    .pts-breakdown { display:flex; flex-wrap:wrap; gap:8px; }
    .pts-chip { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 14px; }
    .pts-chip-dist { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
    .pts-chip-val { font-size:13px; font-weight:700; color:#FBBF24; }
    .pts-chip-rank { font-size:10px; color:var(--muted); margin-left:4px; }
    .charts { display:grid; gap:20px; }
    .chart-block { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:28px; }
    .chart-block h3 { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:24px; }
    .two-col { grid-template-columns:3fr 2fr; }
    @media(max-width:900px) { .two-col { grid-template-columns:1fr; } }
    canvas { width:100% !important; }

    /* ── Loading state ──────────────────────────────────────────────────────── */
    .loading {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:60vh; gap:16px; color:var(--muted);
    }
    .spinner {
      width:32px; height:32px; border:2px solid var(--border);
      border-top-color:var(--orange); border-radius:50%;
      animation:spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Overlay ──────────────────────────────────────────────────────────────── */
    #overlay {
      display:none; position:fixed; inset:0; background:var(--bg);
      z-index:100; overflow-y:auto; padding:40px 32px;
      animation:fadeIn 0.18s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .back-btn {
      background:none; border:1px solid var(--border); color:var(--muted);
      font-size:12px; letter-spacing:1px; padding:8px 18px; border-radius:8px;
      cursor:pointer; margin-bottom:40px; display:inline-flex; align-items:center;
      gap:8px; transition:color 0.2s, border-color 0.2s; font-family:inherit;
    }
    .back-btn:hover { color:var(--text); border-color:#3a3a44; }
    .overlay-accent { height:4px; border-radius:99px; margin-bottom:20px; max-width:120px; }
    .overlay-tag { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
    .overlay-name { font-size:42px; font-weight:700; letter-spacing:-1px; margin-bottom:32px; line-height:1; }
    .overlay-stats { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:14px; margin-bottom:24px; }
    .overlay-stat { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 20px; }
    .overlay-stat-val { font-size:28px; font-weight:700; line-height:1; margin-bottom:4px; }
    .overlay-stat-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
    .overlay-life-section { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px 24px; margin-bottom:32px; }
    .overlay-life-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:16px; flex-wrap:wrap; }
    .overlay-life-pct { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
    .overlay-charts { display:grid; grid-template-columns:2fr 1fr; gap:20px; }
    @media(max-width:900px) { .overlay-charts { grid-template-columns:1fr; } }
    .overlay-prs { margin-top:32px; }
    .overlay-prs h3 { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:16px; }
    .pr-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:10px; }
    .pr-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; position:relative; }
    .pr-card.pr-overall { border-color:#6B7280; }
    .pr-dist { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
    .pr-time { font-size:22px; font-weight:700; line-height:1; margin-bottom:4px; }
    .pr-pace { font-size:11px; color:var(--muted); margin-bottom:2px; }
    .pr-date { font-size:10px; color:#555; }
    .pr-badge { position:absolute; top:8px; right:10px; font-size:9px; font-weight:700; letter-spacing:1px; color:#FBBF24; }
    .leaderboard-wrap { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:28px; margin-bottom:32px; overflow-x:auto; }
    .leaderboard-wrap h3 { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:24px; }
    .leaderboard-wrap table { width:100%; border-collapse:collapse; font-size:13px; }
    .leaderboard-wrap th { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); font-weight:400; padding:0 12px 10px; text-align:left; border-bottom:1px solid var(--border); }
    .leaderboard-wrap td { padding:10px 12px; border-bottom:1px solid #1a1a22; vertical-align:middle; }
    .lb-row { cursor:pointer; transition:background 0.12s; }
    .lb-row:hover td { background:rgba(255,255,255,0.03); }
    .lb-expand-row td { padding:0 !important; border-bottom:1px solid var(--border) !important; }
    .lb-expand-inner { padding:12px 12px 16px 28px; }
    .lb-top5 { display:flex; flex-direction:column; gap:8px; }
    .lb-top5-item { display:flex; align-items:center; gap:10px; font-size:12px; }
    .lb-rank-num { width:16px; font-size:10px; color:#555; text-align:right; flex-shrink:0; }
    .lb-top5-time { font-weight:700; font-size:13px; min-width:44px; }
    .lb-top5-pace { color:var(--muted); font-size:11px; min-width:64px; }
    .lb-top5-name { color:#ccc; font-size:12px; }
    .lb-top5-model { color:#555; font-size:10px; margin-left:4px; }
    .lb-swatch { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; flex-shrink:0; }
    .lb-shoe { display:flex; align-items:center; }
    .lb-shoe-model { font-size:10px; color:#555; margin-left:4px; }
    .lb-time { font-weight:700; font-size:15px; }
    .lb-pace { color:var(--muted); font-size:12px; }
    .lb-date { color:#555; font-size:11px; }
    .lb-pr { font-size:9px; font-weight:700; color:#FBBF24; letter-spacing:1px; margin-left:6px; }

    /* ── Logbook ──────────────────────────────────────────────────────────────── */
    .log-filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
    .log-chip { display:flex; align-items:center; gap:7px; background:var(--surface); cursor:pointer;
                border:1px solid var(--border); border-radius:99px; padding:5px 14px 5px 6px;
                color:var(--muted); font-size:12px; font-family:inherit;
                transition:color 0.15s, border-color 0.15s; }
    .log-chip:hover { color:var(--text); border-color:#3a3a44; }
    .log-chip.active { color:var(--text); border-color:#3a3a44; background:var(--surface2); }
    .log-chip img { width:26px; height:16px; object-fit:contain; }
    .log-chip-dot { width:8px; height:8px; border-radius:50%; margin-left:6px; }
    .log-chip-all { padding-left:14px; }
    .log-table { width:100%; border-collapse:collapse; font-size:13px; }
    .log-table th { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted);
                    font-weight:400; padding:0 12px 10px; text-align:left; border-bottom:1px solid var(--border); }
    .log-table td { padding:9px 12px; border-bottom:1px solid #1a1a22; vertical-align:middle; }
    .log-table .num { text-align:right; white-space:nowrap; }
    .log-shoe-cell { display:flex; align-items:center; gap:9px; min-width:0; }
    .log-shoe-img { width:44px; height:26px; object-fit:contain; flex-shrink:0; }
    .log-shoe-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; margin:0 17px; }
    .log-shoe-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    /* Several shoes share a name ("Long run"), so the model disambiguates */
    .log-shoe-text { display:flex; flex-direction:column; min-width:0; line-height:1.3; }
    .log-shoe-model { font-size:10px; color:#555; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .log-chip-model { color:#555; margin-left:5px; }
    .log-date { color:var(--muted); white-space:nowrap; font-size:12px; }
    .log-name { max-width:260px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .log-pill { display:inline-block; font-size:10px; letter-spacing:0.5px; padding:3px 9px;
                border-radius:99px; white-space:nowrap; }
    .log-sub { color:var(--muted); font-size:11px; }
    .log-pts { font-weight:700; color:#FBBF24; }
    .log-pts-none { color:#444; }
    .log-more { display:block; width:100%; margin-top:18px; background:none; cursor:pointer;
                border:1px solid var(--border); border-radius:8px; padding:11px; color:var(--muted);
                font-size:12px; letter-spacing:1px; text-transform:uppercase; font-family:inherit;
                transition:color 0.15s, border-color 0.15s; }
    .log-more:hover { color:var(--text); border-color:#3a3a44; }
    .log-empty { color:var(--muted); font-size:13px; padding:28px 12px; text-align:center; }
    .log-detail-title { font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
                        color:var(--muted); margin-bottom:12px; }
    .log-detail-row { display:flex; align-items:baseline; gap:10px; font-size:12px; margin-bottom:8px; }
    .log-detail-dist { min-width:88px; text-transform:uppercase; font-size:10px;
                       letter-spacing:1px; color:var(--muted); }
    .log-detail-time { font-weight:700; font-size:13px; min-width:72px; }
    .log-detail-note { color:#ccc; flex:1; }
    .log-detail-pts { font-weight:700; color:#FBBF24; white-space:nowrap; }
    .log-detail-pts.zero { color:#555; }
    .log-strava { display:inline-flex; align-items:center; gap:6px; margin-top:6px;
                  background:var(--orange); color:#fff; text-decoration:none; border-radius:6px;
                  padding:8px 16px; font-size:12px; font-weight:700; letter-spacing:0.5px; }
    .log-strava:hover { filter:brightness(1.1); }

    /* ── Tab bar ──────────────────────────────────────────────────────────────── */
    .tabs-bar { display:flex; gap:8px; margin:24px 0 32px; }
    .tab-btn { background:var(--surface); border:1px solid var(--border); border-radius:8px;
               padding:8px 22px; color:var(--muted); font-size:12px; letter-spacing:1px;
               text-transform:uppercase; cursor:pointer; font-family:inherit;
               transition:color 0.15s, border-color 0.15s; }
    .tab-btn.active, .tab-btn:hover { color:var(--text); border-color:#3a3a44; }

    /* ── Podium leaderboard ───────────────────────────────────────────────────── */
    .lb-section-title { font-size:11px; letter-spacing:2px; text-transform:uppercase;
                        color:var(--muted); margin:0 0 20px; }
    .lb-section-title:not(:first-child) { margin-top:48px; }
    .lb-podium-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; margin-bottom:8px; }
    .lb-podium-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px 20px 18px; }
    .lb-podium-card h4 { font-size:10px; letter-spacing:2px; text-transform:uppercase;
                         color:var(--muted); margin-bottom:20px; }
    .podium { display:flex; align-items:flex-end; justify-content:center; gap:6px; margin-bottom:16px; }
    .podium-place { display:flex; flex-direction:column; align-items:center; gap:5px; flex:1; min-width:0; }
    .podium-img { width:64px; height:64px; object-fit:contain; }
    .podium-dot { width:48px; height:48px; border-radius:50%; flex-shrink:0; }
    .podium-rank { font-size:13px; font-weight:700; }
    .podium-shoe-name { font-size:11px; font-weight:600; color:var(--text); text-align:center;
                        white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
    .podium-shoe-model { font-size:9px; color:var(--muted); text-align:center; margin-top:-2px;
                         white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
    .podium-value { font-size:14px; font-weight:700; text-align:center; }
    .podium-sub { font-size:10px; color:var(--muted); text-align:center; margin-top:-2px; }
    .podium-block { width:100%; border-radius:5px 5px 0 0; margin-top:6px; }
    .podium-place.gold   .podium-block { height:80px; }
    .podium-place.silver .podium-block { height:56px; }
    .podium-place.bronze .podium-block { height:36px; }
    .podium-block-empty { background:var(--border); }
    .lb-tail { border-top:1px solid var(--border); padding-top:12px; display:flex; flex-direction:column; gap:7px; }
    .lb-tail-item { display:flex; align-items:center; gap:8px; font-size:12px; }
    .lb-tail-rank { color:var(--muted); width:14px; font-size:11px; flex-shrink:0; }
    .lb-tail-swatch { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .lb-tail-name { flex:1; color:var(--text); }
    .lb-tail-value { color:var(--muted); font-size:11px; }

    /* ── Small screens ─────────────────────────────────────────────────────────── */
    /* The only phone breakpoint in the file. Keeps the page from scrolling
       sideways and reflows the logbook table into cards. */
    @media(max-width:700px) {
      body { padding:24px 14px; }
      .header { margin-bottom:32px; }
      .header-right { gap:20px; flex-wrap:wrap; }
      .header-left h2 { font-size:30px; }
      .stat-val { font-size:24px; }
      .tabs-bar { flex-wrap:wrap; }
      .tab-btn { padding:8px 16px; }
      .leaderboard-wrap { padding:18px 14px; }
      .log-chip { max-width:100%; }
      .log-chip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .log-table thead { display:none; }
      .log-table, .log-table tbody, .log-table tr, .log-table td { display:block; }
      .log-table tr.lb-row {
        display:grid;
        grid-template-columns:auto 1fr auto;
        grid-template-areas:
          "name name pts"
          "date type type"
          "km   elev time"
          "shoe shoe shoe";
        gap:8px 12px; align-items:center;
        background:var(--surface2); border:1px solid var(--border); border-radius:12px;
        padding:14px; margin-bottom:10px;
      }
      .log-table tr.lb-row td { padding:0; border-bottom:none; min-width:0; }
      .log-table tr.lb-row:hover td { background:none; }
      .log-table .num { text-align:left; }
      .c-name { grid-area:name; }
      .c-pts  { grid-area:pts; text-align:right; }
      .c-date { grid-area:date; }
      .c-type { grid-area:type; }
      .c-km   { grid-area:km; }
      .c-elev { grid-area:elev; }
      .c-time { grid-area:time; text-align:right; }
      .c-shoe { grid-area:shoe; border-top:1px solid var(--border); padding-top:11px; }
      /* Units live in the <th> on desktop, so the cards have to restate them */
      .c-km::after   { content:' km'; color:var(--muted); font-size:11px; }
      .c-elev::before{ content:'↑';   color:var(--muted); }
      .c-elev::after { content:' m';  color:var(--muted); font-size:11px; }
      .log-name { max-width:none; white-space:normal; }
      .log-shoe-dot { margin:0 8px 0 0; }
      .lb-expand-inner { padding:12px 14px 16px; }
      .log-detail-row { flex-wrap:wrap; gap:3px 10px; }
      .log-detail-dist { min-width:0; }
      .log-detail-note { flex:1 0 100%; }
    }
  </style>
</head>
<body>

  <!-- Content is rendered dynamically from inline dashboard data -->
  <div id="app">
    <div class="loading">
      <div class="spinner"></div>
      <span>Loading dashboard…</span>
    </div>
  </div>

  <!-- Shoe detail overlay -->
  <div id="overlay">
    <button class="back-btn" onclick="closeShoe()">← Back to shoes</button>
    <div id="overlay-content"></div>
  </div>

    const SPEED_PTS = [8, 5, 3, 2, 1]; // 1st → 5th place

    function computeSpeedPoints() {
      const pts = {}, breakdown = {};
      shoes.forEach(s => { pts[s.id] = 0; breakdown[s.id] = {}; });
      DISTANCE_ORDER.forEach(dist => {
        const ranked = shoes
          .filter(s => s.best_efforts && s.best_efforts[dist])
          // Tie-break on shoe id: without it a tied time is decided by the order
          // of `shoes`, which is sorted by most recent use and so drifts over time.

          .sort((a, b) => a.best_efforts[dist].elapsed_time - b.best_efforts[dist].elapsed_time

        ranked.forEach((s, i) => {
          if (i < SPEED_PTS.length) {
            pts[s.id] += SPEED_PTS[i];
            breakdown[s.id][dist] = { rank: i + 1, pts: SPEED_PTS[i] };
          }
        });
      });
      speedPoints = { pts, breakdown };
    }

    function sortedShoes() {
      return [...shoes].sort((a, b) => {
        if (currentSort === 'points') return (speedPoints.pts[b.id] || 0) - (speedPoints.pts[a.id] || 0);

          if (a.retired && !b.retired) return 1;
          if (!a.retired && b.retired) return -1;
          if (a.retired && b.retired) return 0;
          return (a.remaining ?? 9999) - (b.remaining ?? 9999);

        // default: latest use

    // ── Weekly target retirement projection ───────────────────────────────────
    function computeRetirementProjection(weeklyKm) {
      const today = new Date();
      let pool = shoes
        .filter(s => !s.retired && !s.race && s.km_per_week > 0)
        .map(s => ({
          id: s.id,
          remaining: s.remaining ?? Math.max(0, s.retirement_km - s.total_km),
          weight: s.km_per_week,
          weeklyAlloc: 0,
          weeksToRetire: 0,
        }));
      let weekOffset = 0;
      const projections = {};
      while (pool.length > 0) {
        const totalWeight = pool.reduce((acc, x) => acc + x.weight, 0);
        pool.forEach(s => { s.weeklyAlloc = weeklyKm * (s.weight / totalWeight); });
        pool.forEach(s => { s.weeksToRetire = s.remaining / s.weeklyAlloc; });
        const minWeeks = Math.min(...pool.map(s => s.weeksToRetire));
        pool.forEach(s => { s.remaining -= s.weeklyAlloc * minWeeks; });
        weekOffset += minWeeks;
        pool = pool.filter(s => {
          if (s.remaining <= 0.5) {
            const d = new Date(today);
            d.setDate(d.getDate() + Math.round(weekOffset * 7));
            projections[s.id] = {
              retireDate: d.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' }),
              weeklyAlloc: Math.round(s.weeklyAlloc),
            };
            return false;
          }
          return true;
        });
      }
      return projections;
    }

            <canvas id="cumChart" height="300"></canvas>
          </div>
          <div class="charts two-col">
            <div class="chart-block">
              <h3>Weekly km per shoe</h3>
              <canvas id="monthlyChart" height="280"></canvas>
            </div>
            <div class="chart-block">
              <h3>Activity type per shoe</h3>
              <canvas id="typeChart" height="280"></canvas>
            </div>
          </div>
        </div>

        </div>

        <div class="tab-section" id="tab-leaderboard" style="display:none">
          ${renderLeaderboardTab()}
        </div>

        <div class="tab-section" id="tab-logbook" style="display:none">
          ${renderLogbookTab()}
        </div>
      `;

      renderCards();
      renderCharts();
      renderLogRows();
    }

    // ── Render shoe cards ─────────────────────────────────────────────────────
    function renderCards() {
      const container = document.getElementById('cards-container');
      if (!container) return;
      container.innerHTML = sortedShoes().map(cardHTML).join('');
    }

    function cardHTML(s) {
      const pct       = s.pct_life;
      const retKm     = s.retirement_km;
      const remaining = s.remaining ?? Math.max(0, retKm - s.total_km);
      const warn      = !s.retired && pct >= 70;
      const cls       = 'card' + (s.retired ? ' retired' : '') + (warn ? ' warning' : '');
      const runsLeft  = s.retired ? '—' : (s.runs_left ? `~${s.runs_left}` : '?');
      const proj      = (!s.retired && !s.race) ? retirementProjections[s.id] : null;
      const totalPts  = speedPoints.pts?.[s.id] || 0;

      let retireLine = '';
      if (!s.retired) {
        const retDate = proj ? proj.retireDate : s.retire_date;
        if (retDate) retireLine = `<div class="card-retire">Est. retirement <span>${retDate}</span></div>`;
      } else if (s.retire_date) {
        retireLine = `<div class="card-retire">Retired <span>${s.retire_date}</span></div>`;
      }

      const daysSinceUse = s.last_run_iso
        ? Math.floor((Date.now() - new Date(s.last_run_iso)) / 86400000)
        : null;
      const idle = !s.retired && daysSinceUse !== null && daysSinceUse >= 30;

      let badge = '';
      if (s.retired) {
        badge = '<div class="retired-badge">✓ Retired</div>';
      } else {
        if (pct >= 83)  badge += '<div class="warning-badge">⚠ Approaching retirement</div>';
        if (idle)       badge += `<div class="idle-badge">— Not used in ${daysSinceUse}d</div>`;
      }

      const imgFile = shoeImage(s.model);
      const imgHTML = imgFile
        ? `<div class="card-shoe-img"><img src="${imgFile.replace(/ /g,'%20')}" alt="${s.model}" loading="lazy" onerror="this.parentElement.remove()"></div>`
        : '';

      const pal       = shoePalette(s.model);
      const primary   = pal ? pal.primary   : s.color;
      const secondary = pal ? pal.secondary : s.secondary;

      return `
        <div class="${cls}" data-shoe-id="${s.id}" onclick="openShoe('${s.id}')">
          <div class="card-accent" style="background:repeating-linear-gradient(45deg,${primary},${primary} 8px,${secondary} 8px,${secondary} 16px)"></div>
          ${imgHTML}
          <div class="card-tag">${s.brand} · ${s.model}</div>
          <div class="card-model">${s.name}</div>
          ${totalPts > 0 ? `<div class="card-pts">${totalPts} speed pts</div>` : ''}
          <div class="card-km" style="color:${primary}">${s.total_km} <span style="font-size:14px;font-weight:400;color:var(--muted)">km</span></div>
          <div class="card-runs">${s.runs} activities</div>
          <div class="card-stats">
            <div class="mini-stat">
              <div class="mini-stat-val" style="color:${secondary}">${s.avg_km}</div>
              <div class="mini-stat-label">avg km/run</div>
            </div>
            <div class="mini-stat">
              <div class="mini-stat-val" style="color:${secondary}">${runsLeft}</div>
              <div class="mini-stat-label">runs left</div>
            </div>
          </div>
          ${retireLine}
          <div class="life-track"><div class="life-fill" style="width:${pct}%;background:${primary}"></div></div>
          <div class="life-label"><span>${pct}% of ${retKm}km</span><span>${remaining} km left</span></div>
          ${badge}
        </div>`;
    }

    // ── Podium helper ─────────────────────────────────────────────────────────
    function podiumHTML(label, ranked) {
      // ranked = [{shoe, value, sub?}] sorted best-first, up to 5
      // Display order: 2nd(left) 1st(center) 3rd(right). The medal class now
      // only sets the block height; the block colour comes from the shoe.
      const order  = [ranked[1], ranked[0], ranked[2]];
      const medals = ['silver', 'gold', 'bronze'];
      const ranks  = ['2', '1', '3'];

      const placesHTML = order.map((item, di) => {
        if (!item) return `<div class="podium-place ${medals[di]}"><div class="podium-block podium-block-empty"></div></div>`;
        const pal   = shoePalette(item.shoe.model);
        const color = pal ? pal.primary : item.shoe.color;
        const imgFile = shoeImage(item.shoe.model);
        const visual  = imgFile
          ? `<img class="podium-img" src="${imgFile.replace(/ /g,'%20')}" alt="${item.shoe.model}" onerror="this.style.display='none'">`
          : `<div class="podium-dot" style="background:${color}"></div>`;
        return `<div class="podium-place ${medals[di]}">
          ${visual}
          <div class="podium-rank" style="color:${color}">${ranks[di]}</div>
          <div class="podium-shoe-name">${item.shoe.model}</div>
          <div class="podium-shoe-model">${item.shoe.name}</div>
          <div class="podium-value" style="color:${color}">${item.value}</div>
          ${item.sub ? `<div class="podium-sub">${item.sub}</div>` : ''}
          <div class="podium-block" style="background:${color}"></div>
        </div>`;
      }).join('');

      const tailHTML = ranked.slice(3).map((item, i) => {
        const pal   = shoePalette(item.shoe.model);
        const color = pal ? pal.primary : item.shoe.color;
        return `<div class="lb-tail-item">
          <span class="lb-tail-rank">${i + 4}</span>
          <span class="lb-tail-swatch" style="background:${color}"></span>
          <span class="lb-tail-name">${item.shoe.model}</span>
          <span class="lb-tail-value">${item.value}${item.sub ? ' · ' + item.sub : ''}</span>
        </div>`;
      }).join('');

      return `<div class="lb-podium-card">
        <h4>${label}</h4>
        <div class="podium">${placesHTML}</div>
        ${tailHTML ? `<div class="lb-tail">${tailHTML}</div>` : ''}
      </div>`;
    }

    // ── Leaderboard tab ───────────────────────────────────────────────────────
    function renderLeaderboardTab() {
      // ── Speed Records ────────────────────────────────────────────────────────
      const speedCards = DISTANCE_ORDER.map(dist => {
        const ranked = shoes
          .filter(s => s.best_efforts && s.best_efforts[dist])
          .sort((a, b) => a.best_efforts[dist].elapsed_time - b.best_efforts[dist].elapsed_time)
          .slice(0, 5)
          .map(s => ({ shoe: s, value: s.best_efforts[dist].time_str, sub: s.best_efforts[dist].pace_str }));
        if (ranked.length < 1) return '';
        return podiumHTML(dist, ranked);
      }).join('');

      // ── Stat leaderboards ────────────────────────────────────────────────────
      const STAT_CATS = [
        { label: 'Most Long Runs',  fn: s => s.types['Long Run']  || 0, fmt: v => v + ' runs' },
        { label: 'Most Workouts',   fn: s => s.types['Workout']   || 0, fmt: v => v + ' workouts' },
        { label: 'Most Races',      fn: s => s.types['Race']      || 0, fmt: v => v + ' races' },
        { label: 'Most Trail Runs', fn: s => s.types['TrailRun']  || 0, fmt: v => v + ' trail runs' },
        { label: 'Total km',        fn: s => s.total_km,               fmt: v => v + ' km' },
        { label: 'Longest Run',     fn: s => Math.max(...(s.run_distances || [0])), fmt: v => v + ' km' },
      ];
      const statCards = STAT_CATS.map(cat => {
        const ranked = shoes
          .filter(s => cat.fn(s) > 0)
          .sort((a, b) => cat.fn(b) - cat.fn(a))
          .slice(0, 5)
          .map(s => ({ shoe: s, value: cat.fmt(cat.fn(s)) }));
        if (ranked.length < 1) return '';
        return podiumHTML(cat.label, ranked);
      }).join('');

      return `
        <p class="lb-section-title">Speed Records</p>
        <div class="lb-podium-grid">${speedCards}</div>
        <p class="lb-section-title">Activity Leaderboards</p>
        <div class="lb-podium-grid">${statCards}</div>
      `;
    }

    // ── Logbook tab ───────────────────────────────────────────────────────────
    function shoeById(id) {
      return shoes.find(s => s.id === id) || null;
    }

    function fmtLogDate(iso) {
      const dt = new Date(iso);
      if (isNaN(dt)) return iso.slice(0, 10);
      const opts = { day: 'numeric', month: 'short' };
      // Only show the year once we are outside the current one
      if (dt.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
      return dt.toLocaleDateString('en-GB', opts);
    }

    function fmtDuration(sec) {
      if (!sec) return '—';
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
               : `${m}:${String(s).padStart(2,'0')}`;
    }

    function fmtPace(sec, km) {
      if (!sec || !km) return '';
      const p = sec / km;
      return `${Math.floor(p / 60)}:${String(Math.round(p % 60)).padStart(2,'0')} /km`;
    }

    function filteredActivities() {
      return logShoeFilter ? activities.filter(a => a.gear === logShoeFilter) : activities;
    }

    function renderLogbookTab() {
      const chips = shoes.map(s => {
        const pal = shoePalette(s.model);
        const img = shoeImage(s.model);
        const badge = img
          ? `<img src="${img.replace(/ /g,'%20')}" loading="lazy" alt="">`
          : `<span class="log-chip-dot" style="background:${(pal ? pal.primary : s.color)}"></span>`;
        return `<button class="log-chip" data-shoe="${s.id}" onclick="setLogShoe('${s.id}')">
                  ${badge}<span>${esc(s.name)}<span class="log-chip-model">${esc(s.model)}</span></span>
                </button>`;
      }).join('');

      return `
        <p class="lb-section-title">Activity log</p>
        <div class="log-filters">
          <button class="log-chip log-chip-all active" data-shoe="" onclick="setLogShoe(null)">All shoes</button>
          ${chips}
        </div>
        <div class="leaderboard-wrap">
          <table class="log-table">
            <thead>
              <tr>
                <th>Shoe</th><th>Date</th><th>Activity</th><th>Type</th>
                <th class="num">Km</th><th class="num">Elev m</th>
                <th class="num">Time</th><th class="num">Pts</th>
              </tr>
            </thead>
            <tbody id="log-body"></tbody>
          </table>
          <div id="log-more-wrap"></div>
        </div>
      `;
    }

    function renderLogRows() {
      const body = document.getElementById('log-body');
      if (!body) return;
      const list = filteredActivities();

      if (!list.length) {
        body.innerHTML = `<tr><td colspan="8" class="log-empty">No activities for this shoe.</td></tr>`;
        document.getElementById('log-more-wrap').innerHTML = '';
        return;
      }

      body.innerHTML = list.slice(0, logVisible).map(logRowHTML).join('');

      const remaining = list.length - Math.min(logVisible, list.length);
      document.getElementById('log-more-wrap').innerHTML = remaining
        ? `<button class="log-more" onclick="showMoreLog()">Show ${Math.min(LOG_PAGE, remaining)} more · ${remaining} left</button>`
        : '';
    }

    function logRowHTML(a) {
      const shoe = shoeById(a.gear);
      const pal  = shoe ? shoePalette(shoe.model) : null;
      const tint = pal ? pal.primary : (shoe ? shoe.color : '#888');
      const img  = shoe ? shoeImage(shoe.model) : null;

      const shoeCell = `<div class="log-shoe-cell">
          ${img ? `<img class="log-shoe-img" src="${img.replace(/ /g,'%20')}" loading="lazy" alt="">`
                : `<span class="log-shoe-dot" style="background:${tint}"></span>`}
          <span class="log-shoe-text">
            <span class="log-shoe-name">${esc(shoe ? shoe.name : '—')}</span>
            <span class="log-shoe-model">${esc(shoe ? shoe.model : '')}</span>
          </span>
        </div>`;

      // pts is null for anything predating the speed points baseline
      const pts = a.pts == null
        ? `<span class="log-pts-none" title="Speed points tracking started after this run">·</span>`
        : a.pts > 0 ? `<span class="log-pts">+${a.pts}</span>`
                    : `<span class="log-pts-none">0</span>`;

      const pace = fmtPace(a.time, a.km);

      return `
        <tr class="lb-row" onclick="toggleLogRow(${a.id})">
          <td class="c-shoe">${shoeCell}</td>
          <td class="c-date log-date">${fmtLogDate(a.date)}</td>
          <td class="c-name log-name">${esc(a.name) || '<span class="log-sub">Untitled</span>'}</td>
          <td class="c-type"><span class="log-pill" style="background:${typeColor(a.type)}22;color:${typeColor(a.type)}">${esc(a.type)}</span></td>
          <td class="c-km num">${a.km.toFixed(1)}</td>
          <td class="c-elev num">${a.elev}</td>
          <td class="c-time num">${fmtDuration(a.time)}${pace ? `<div class="log-sub">${pace}</div>` : ''}</td>
          <td class="c-pts num">${pts}</td>
        </tr>
        <tr class="lb-expand-row" id="log-exp-${a.id}" style="display:none">
          <td colspan="8"><div class="lb-expand-inner"></div></td>
        </tr>`;
    }

    function logExpandHTML(a) {
      let inner = '';

      if (a.details && a.details.length) {
        inner += `<p class="log-detail-title">Standings moved</p>`;
        inner += a.details.map(d => {
          let note;
          if (d.rank_before == null) {
            note = `first record at this distance — straight in at #${d.rank_after}`;
          } else if (d.rank_before === d.rank_after) {
            note = `still #${d.rank_after}, improved from ${d.prev}`;
          } else {
            note = `#${d.rank_before} → #${d.rank_after}, improved from ${d.prev}`;
          }
          if (d.passed && d.passed.length) note += ` · overtook ${d.passed.map(esc).join(', ')}`;
          return `<div class="log-detail-row">
              <span class="log-detail-dist">${esc(d.dist)}</span>
              <span class="log-detail-time">${esc(d.new)}</span>
              <span class="log-detail-note">${note}</span>
              <span class="log-detail-pts${d.pts ? '' : ' zero'}">${d.pts > 0 ? '+' : ''}${d.pts} pts</span>
            </div>`;
        }).join('');
      } else if (a.pts == null) {
        inner += `<p class="log-detail-title">This run predates speed points tracking</p>`;
      } else {
        inner += `<p class="log-detail-title">No records set — standings unchanged</p>`;
      }

      inner += `<a class="log-strava" href="https://www.strava.com/activities/${a.id}"
                   target="_blank" rel="noopener" onclick="event.stopPropagation()">View on Strava ↗</a>`;
      return inner;
    }

    function toggleLogRow(id) {
      const row = document.getElementById('log-exp-' + id);
      if (!row) return;
      const isOpen = row.style.display !== 'none';
      document.querySelectorAll('.lb-expand-row').forEach(r => { r.style.display = 'none'; });
      if (isOpen) return;                       // second click on an open row closes it
      const a = activities.find(x => String(x.id) === String(id));
      if (!a) return;
      row.querySelector('.lb-expand-inner').innerHTML = logExpandHTML(a);
      row.style.display = '';
    }

    function setLogShoe(gid) {
      logShoeFilter = gid;
      logVisible    = LOG_PAGE;
      document.querySelectorAll('.log-chip').forEach(c =>
        c.classList.toggle('active', (c.dataset.shoe || '') === (gid || ''))
      );
      renderLogRows();
    }

    function showMoreLog() {
      logVisible += LOG_PAGE;
      renderLogRows();
    }

    // ── Render main charts ────────────────────────────────────────────────────
    function renderCharts() {
      if (cumChart)     { cumChart.destroy();     cumChart     = null; }
      if (monthlyChart) { monthlyChart.destroy(); monthlyChart = null; }
      if (typeChart)    { typeChart.destroy();    typeChart    = null; }

      cumChart = new Chart(document.getElementById('cumChart'), {
        type: 'line',
        data: {
          labels: months,
          datasets: shoes.map(s => {
            // Start each line at the shoe's first run (null before it existed).
            // Retired shoes stop at their last run; active shoes stay in the
            // graph and simply hold a flat line until they're used again.
            const first = s.monthly.findIndex(v => v > 0);
            let last = -1;
            for (let i = s.monthly.length - 1; i >= 0; i--) { if (s.monthly[i] > 0) { last = i; break; } }
            const data = s.cumulative.map((v, i) => {
              if (first === -1 || i < first) return null;   // before it existed
              if (s.retired && i > last)     return null;   // retired: stop at last run
              return v;                                     // active: flat to present
            });
            return {
              label: s.model, data, borderColor: s.color,
              backgroundColor: s.color + '12', borderWidth: s.retired ? 1.5 : 2.5,
              borderDash: s.retired ? [4,3] : [], pointRadius: 0, pointHoverRadius: 5,
              fill: false, tension: 0.4, spanGaps: false,
            };
          }),
        },
        options: {
          responsive: true,
          interaction: { mode:'index', intersect:false },
          plugins: {
            legend: { labels: { color:'#888', font:{ size:11 }, boxWidth:24, padding:16 } },
            tooltip: { ...tip, filter: c => c.parsed.y !== null, callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y} km` } },
          },
          scales: {
            x: { ticks:{ color:tick, font:{ size:10 }, maxRotation:45 }, grid:{ color:grid } },
            y: { ticks:{ color:tick, font:{ size:10 }, callback: v => v+'km' }, grid:{ color:grid } },
          },
        },
      });

      monthlyChart = new Chart(document.getElementById('monthlyChart'), {
        type: 'bar',
        data: {
          labels: weeks,
          datasets: shoes.map(s => ({
            label: s.model, data: s.weekly,
            backgroundColor: s.color + 'cc', borderRadius: 2, borderSkipped: false,
          })),
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: { ...tip, callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y} km` } },
          },
          scales: {
            x: { stacked:true, ticks:{ color:tick, font:{ size:9 }, maxRotation:60, autoSkip:true, maxTicksLimit:24 }, grid:{ color:grid } },
            y: { stacked:true, ticks:{ color:tick, font:{ size:10 }, callback: v => v+'km' }, grid:{ color:grid } },
          },
        },
      });

      const allTypes   = ['Run','Race','Long Run','Workout','TrailRun','Walk','Hike'];
      typeChart = new Chart(document.getElementById('typeChart'), {
        type: 'bar',
        data: {
          labels: shoes.map(s => s.model),
          datasets: allTypes.map(t => ({
            label: t, data: shoes.map(s => s.types[t] || 0),
            backgroundColor: typeColor(t) + 'cc', borderRadius: 2, borderSkipped: false,
          })),
        },
        options: {
          responsive: true,
          indexAxis: 'y',
          plugins: {
            legend: { labels: { color:'#888', font:{ size:11 }, boxWidth:20, padding:12 } },
            tooltip: { ...tip },
          },
          scales: {
            x: { stacked:true, ticks:{ color:tick, font:{ size:10 } }, grid:{ color:grid } },
            y: { stacked:true, ticks:{ color:tick, font:{ size:10 } }, grid:{ color:grid } },
          },
        },
      });
    }

    // ── Shoe detail overlay ───────────────────────────────────────────────────
    function openShoe(shoeId) {
      const shoe = shoes.find(s => s.id === shoeId);
      if (!shoe) return;

      const retKm     = shoe.retirement_km;
      const pct       = shoe.pct_life;
      const remaining = shoe.remaining ?? Math.max(0, retKm - shoe.total_km);

      // Histogram: 1km buckets 0–10, 2km buckets 10–20, 5km buckets 20–50, then 50+
      const HIST_EDGES = [
        ...Array.from({length: 10}, (_, i) => i),          // 0,1,2,...,9  → 10 buckets of 1km
        ...Array.from({length: 5},  (_, i) => 10 + i * 2), // 10,12,14,16,18 → 5 buckets of 2km
        ...Array.from({length: 6},  (_, i) => 20 + i * 5), // 20,25,30,35,40,45 → 6 buckets of 5km
        50,                                                  // 50+ catch-all
      ]; // 22 edges → 22 buckets (last is open-ended)
      const buckets = new Array(HIST_EDGES.length).fill(0);
      shoe.run_distances.forEach(d => {
        let idx = HIST_EDGES.findIndex((edge, i) => i === HIST_EDGES.length - 1 || d < HIST_EDGES[i + 1]);
        buckets[Math.max(0, idx)]++;
      });
      const histLabels = HIST_EDGES.map((edge, i) =>
        i === HIST_EDGES.length - 1 ? '50+' : `${edge}–${HIST_EDGES[i + 1]}`
      );

      const pieLabels = Object.keys(shoe.types);
      const pieData   = Object.values(shoe.types);

      document.getElementById('overlay-content').innerHTML = `
        <div class="overlay-accent" style="background:repeating-linear-gradient(45deg,${shoe.color},${shoe.color} 8px,${shoe.secondary} 8px,${shoe.secondary} 16px)"></div>
        <div class="overlay-tag">${shoe.brand} · ${shoe.model}</div>
        <div class="overlay-name" style="color:${shoe.color}">${shoe.name}</div>

        <div class="overlay-stats">
          <div class="overlay-stat">
            <div class="overlay-stat-val" style="color:${shoe.color}">${shoe.total_km}</div>
            <div class="overlay-stat-label">Total km</div>
          </div>
          <div class="overlay-stat">
            <div class="overlay-stat-val" style="color:${shoe.secondary}">${shoe.runs}</div>
            <div class="overlay-stat-label">Activities</div>
          </div>
          <div class="overlay-stat">
            <div class="overlay-stat-val" style="color:${shoe.secondary}">${shoe.avg_km}</div>
            <div class="overlay-stat-label">Avg km / run</div>
          </div>
          <div class="overlay-stat">
            <div class="overlay-stat-val" style="color:${shoe.secondary}">${shoe.km_per_week}</div>
            <div class="overlay-stat-label">Avg km / week</div>
          </div>
          <div class="overlay-stat">
            <div class="overlay-stat-val" style="color:${shoe.secondary}">${Math.max(...shoe.run_distances)}</div>
            <div class="overlay-stat-label">Longest run</div>
          </div>
          <div class="overlay-stat">
            <div class="overlay-stat-val" style="color:${shoe.secondary}">${(() => { const d = new Date(shoe.last_run_iso); const diff = Math.floor((Date.now() - d) / 86400000); return diff === 0 ? 'Today' : diff + 'd ago'; })()}</div>
            <div class="overlay-stat-label">Last used</div>
          </div>
          <div class="overlay-stat">
            <div class="overlay-stat-val" style="color:${shoe.secondary}">${shoe.first_run}</div>
            <div class="overlay-stat-label">First run</div>
          </div>
          <div class="overlay-stat">
            <div class="overlay-stat-val" style="color:${shoe.secondary}">${shoe.last_run}</div>
            <div class="overlay-stat-label">Last run</div>
          </div>
        </div>

        <div class="overlay-life-section">
          <div class="overlay-life-header">
            <span class="overlay-life-pct" id="overlay-pct-label">${pct}% of ${retKm}km retirement distance</span>
          </div>
          <div class="life-track">
            <div class="life-fill" id="overlay-life-fill" style="width:${pct}%;background:${shoe.color}"></div>
          </div>
          <div class="life-label" style="margin-top:8px">
            <span id="overlay-pct-right">${pct}%</span>
            <span id="overlay-remaining">${remaining} km left</span>
          </div>
        </div>

        <div class="overlay-charts">
          <div class="chart-block">
            <h3>Run distance distribution</h3>
            <canvas id="overlayHist"></canvas>
          </div>
          <div class="chart-block">
            <h3>Activity types</h3>
            <canvas id="overlayPie"></canvas>
          </div>
        </div>
        ${shoe.best_efforts && Object.keys(shoe.best_efforts).length > 0 ? `
        <div class="overlay-prs">
          <h3>Personal Records on this shoe</h3>
          <div class="pr-grid">
            ${DISTANCE_ORDER.filter(d => shoe.best_efforts[d]).map(d => {
              const pr = shoe.best_efforts[d];
              return '<div class="pr-card' + (pr.is_overall_pr ? ' pr-overall' : '') + '">' +
                '<div class="pr-dist">' + d + '</div>' +
                '<div class="pr-time" style="color:' + shoe.color + '">' + pr.time_str + '</div>' +
                '<div class="pr-pace">' + pr.pace_str + '</div>' +
                '<div class="pr-date">' + pr.date + '</div>' +
                (pr.is_overall_pr ? '<div class="pr-badge">PR</div>' : '') +
                '</div>';
            }).join('')}
          </div>
        </div>` : ''}
        ${(speedPoints.pts?.[shoe.id] || 0) > 0 ? (() => {
          const totalPts = speedPoints.pts[shoe.id];
          const chips = Object.entries(speedPoints.breakdown[shoe.id])
            .sort(([,a],[,b]) => a.rank - b.rank)
            .map(([dist, info]) =>
              '<div class="pts-chip">' +
              '<div class="pts-chip-dist">' + dist + '</div>' +
              '<div><span class="pts-chip-val">+' + info.pts + ' pts</span><span class="pts-chip-rank"> · #' + info.rank + '</span></div>' +
              '</div>'
            ).join('');
          return '<div class="overlay-pts"><h3>Speed points</h3><div class="pts-total">' + totalPts + ' pts</div><div class="pts-breakdown">' + chips + '</div></div>';
        })() : ''}
      `;

      if (histChart) { histChart.destroy(); histChart = null; }
      if (pieChart)  { pieChart.destroy();  pieChart  = null; }

      histChart = new Chart(document.getElementById('overlayHist'), {
        type: 'bar',
        data: {
          labels: histLabels,
          datasets: [{ label:'Runs', data: buckets, backgroundColor: shoe.color + 'bb', borderRadius:3, borderSkipped:false }],
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display:false },
            tooltip: { ...tip, callbacks: { label: c => ` ${c.parsed.y} run${c.parsed.y !== 1 ? 's' : ''}` } },
          },
          scales: {
            x: { ticks:{ color:tick, font:{ size:10 }, maxRotation:60 }, grid:{ color:grid } },
            y: { ticks:{ color:tick, font:{ size:10 }, stepSize:1 }, grid:{ color:grid } },
          },
        },
      });

      pieChart = new Chart(document.getElementById('overlayPie'), {
        type: 'doughnut',
        data: {
          labels: pieLabels,
          datasets: [{
            data: pieData,
            backgroundColor: pieLabels.map(l => typeColor(l) + 'dd'),
            borderColor: '#1c1c22', borderWidth:2, hoverOffset:8,
          }],
        },
        options: {
          responsive: true,
          plugins: {
            legend: { labels: { color:'#888', font:{ size:11 }, padding:16 } },
            tooltip: { ...tip },
          },
        },
      });

      document.getElementById('overlay').style.display = 'block';
      document.body.style.overflow = 'hidden';
      window.scrollTo(0, 0);
    }

    function closeShoe() {
      document.getElementById('overlay').style.display = 'none';
      document.body.style.overflow = '';
    }

    // ── Escape key closes overlay ─────────────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.getElementById('overlay').style.display !== 'none') {
        closeShoe();
      }
    });

    // ── Boot ──────────────────────────────────────────────────────────────────
    loadDashboard();
  </script>
</body>
</html>
