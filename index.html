<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shoe Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:#0c0c0e; --surface:#141418; --surface2:#1c1c22;
      --border:#2a2a32; --text:#f0f0f0; --muted:#666; --orange:#FC4C02;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'Helvetica Neue',Arial,sans-serif; padding:40px 32px; min-height:100vh; }
    .header { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:48px; flex-wrap:wrap; gap:16px; }
    .header-left h1 { font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
    .header-left h2 { font-size:36px; font-weight:300; letter-spacing:-0.5px; }
    .header-left h2 span { color:var(--orange); font-weight:700; }
    .header-right { display:flex; gap:32px; }
    .stat { text-align:right; }
    .stat-val { font-size:28px; font-weight:700; line-height:1; }
    .stat-label { font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-top:4px; }
    .generated { font-size:11px; color:var(--muted); }
    .section-title { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:20px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:14px; margin-bottom:48px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; position:relative; overflow:hidden; transition:border-color 0.2s, transform 0.15s; cursor:pointer; }
    .card:hover { border-color:#3a3a44; transform:translateY(-2px); }
    .card.retired { opacity:0.55; }
    .card.warning { border-color:#f59e0b55; }
    .card-accent { position:absolute; top:0; left:0; right:0; height:6px; border-radius:14px 14px 0 0; }
    .card-tag { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
    .card-model { font-size:13px; font-weight:600; margin-bottom:3px; line-height:1.3; }
    .card-km { font-size:30px; font-weight:700; line-height:1; margin-bottom:3px; }
    .card-runs { font-size:11px; color:var(--muted); margin-bottom:14px; }
    .card-stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
    .mini-stat { background:var(--surface2); border-radius:8px; padding:8px 10px; }
    .mini-stat-val { font-size:15px; font-weight:700; line-height:1; margin-bottom:2px; }
    .mini-stat-label { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
    .card-retire { font-size:11px; color:var(--muted); margin-bottom:12px; }
    .card-retire span { font-weight:600; color:var(--text); }
    .life-track { background:var(--surface2); border-radius:99px; height:5px; overflow:hidden; }
    .life-fill { height:5px; border-radius:99px; }
    .life-label { font-size:10px; color:var(--muted); margin-top:6px; display:flex; justify-content:space-between; }
    .warning-badge { margin-top:10px; font-size:10px; color:#f59e0b; letter-spacing:0.5px; }
    .retired-badge { margin-top:10px; font-size:10px; color:var(--muted); letter-spacing:0.5px; }
    .idle-badge    { margin-top:10px; font-size:10px; color:#60a5fa; letter-spacing:0.5px; }
    .target-input-wrap { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); }
    .target-input-wrap input { width:52px; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:3px 8px; font-size:12px; font-family:inherit; text-align:right; outline:none; }
    .target-input-wrap input:focus { border-color:#3a3a44; }
    .card-alloc { font-size:10px; color:var(--muted); margin-top:3px; letter-spacing:0.3px; }
    .card-pts { font-size:11px; color:#FBBF24; margin-top:5px; font-weight:600; }
    .card-shoe-img { margin:-20px -20px 16px; padding-top:6px; height:130px; overflow:hidden; }
    .card-shoe-img img { width:100%; height:100%; object-fit:contain; padding:10px 20px; }
    .sort-bar { display:flex; gap:6px; }
    .sort-btn { background:none; border:1px solid var(--border); color:var(--muted); font-size:10px; letter-spacing:1px; text-transform:uppercase; padding:4px 10px; border-radius:6px; cursor:pointer; font-family:inherit; transition:color 0.15s, border-color 0.15s; }
    .sort-btn.active, .sort-btn:hover { color:var(--text); border-color:#3a3a44; }
    .overlay-pts { margin-top:32px; }
    .overlay-pts h3 { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:16px; }
    .pts-total { font-size:32px; font-weight:700; color:#FBBF24; line-height:1; margin-bottom:16px; }
    .pts-breakdown { display:flex; flex-wrap:wrap; gap:8px; }
    .pts-chip { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 14px; }
    .pts-chip-dist { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
    .pts-chip-val { font-size:13px; font-weight:700; color:#FBBF24; }
    .pts-chip-rank { font-size:10px; color:var(--muted); margin-left:4px; }
    .charts { display:grid; gap:20px; }
    .chart-block { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:28px; }
    .chart-block h3 { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:24px; }
    .two-col { grid-template-columns:3fr 2fr; }
    @media(max-width:900px) { .two-col { grid-template-columns:1fr; } }
    canvas { width:100% !important; }

    /* ── Loading state ──────────────────────────────────────────────────────── */
    .loading {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:60vh; gap:16px; color:var(--muted);
    }
    .spinner {
      width:32px; height:32px; border:2px solid var(--border);
      border-top-color:var(--orange); border-radius:50%;
      animation:spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Overlay ──────────────────────────────────────────────────────────────── */
    #overlay {
      display:none; position:fixed; inset:0; background:var(--bg);
      z-index:100; overflow-y:auto; padding:40px 32px;
      animation:fadeIn 0.18s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .back-btn {
      background:none; border:1px solid var(--border); color:var(--muted);
      font-size:12px; letter-spacing:1px; padding:8px 18px; border-radius:8px;
      cursor:pointer; margin-bottom:40px; display:inline-flex; align-items:center;
      gap:8px; transition:color 0.2s, border-color 0.2s; font-family:inherit;
    }
    .back-btn:hover { color:var(--text); border-color:#3a3a44; }
    .overlay-accent { height:4px; border-radius:99px; margin-bottom:20px; max-width:120px; }
    .overlay-tag { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
    .overlay-name { font-size:42px; font-weight:700; letter-spacing:-1px; margin-bottom:32px; line-height:1; }
    .overlay-stats { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:14px; margin-bottom:24px; }
    .overlay-stat { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 20px; }
    .overlay-stat-val { font-size:28px; font-weight:700; line-height:1; margin-bottom:4px; }
    .overlay-stat-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
    .overlay-life-section { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px 24px; margin-bottom:32px; }
    .overlay-life-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:16px; flex-wrap:wrap; }
    .overlay-life-pct { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
    .overlay-charts { display:grid; grid-template-columns:2fr 1fr; gap:20px; }
    @media(max-width:900px) { .overlay-charts { grid-template-columns:1fr; } }
    .overlay-prs { margin-top:32px; }
    .overlay-prs h3 { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:16px; }
    .pr-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:10px; }
    .pr-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; position:relative; }
    .pr-card.pr-overall { border-color:#6B7280; }
    .pr-dist { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
    .pr-time { font-size:22px; font-weight:700; line-height:1; margin-bottom:4px; }
    .pr-pace { font-size:11px; color:var(--muted); margin-bottom:2px; }
    .pr-date { font-size:10px; color:#555; }
    .pr-badge { position:absolute; top:8px; right:10px; font-size:9px; font-weight:700; letter-spacing:1px; color:#FBBF24; }
    .leaderboard-wrap { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:28px; margin-bottom:32px; overflow-x:auto; }
    .leaderboard-wrap h3 { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:24px; }
    .leaderboard-wrap table { width:100%; border-collapse:collapse; font-size:13px; }
    .leaderboard-wrap th { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); font-weight:400; padding:0 12px 10px; text-align:left; border-bottom:1px solid var(--border); }
    .leaderboard-wrap td { padding:10px 12px; border-bottom:1px solid #1a1a22; vertical-align:middle; }
    .lb-row { cursor:pointer; transition:background 0.12s; }
    .lb-row:hover td { background:rgba(255,255,255,0.03); }
    .lb-expand-row td { padding:0 !important; border-bottom:1px solid var(--border) !important; }
    .lb-expand-inner { padding:12px 12px 16px 28px; }
    .lb-top5 { display:flex; flex-direction:column; gap:8px; }
    .lb-top5-item { display:flex; align-items:center; gap:10px; font-size:12px; }
    .lb-rank-num { width:16px; font-size:10px; color:#555; text-align:right; flex-shrink:0; }
    .lb-top5-time { font-weight:700; font-size:13px; min-width:44px; }
    .lb-top5-pace { color:var(--muted); font-size:11px; min-width:64px; }
    .lb-top5-name { color:#ccc; font-size:12px; }
    .lb-top5-model { color:#555; font-size:10px; margin-left:4px; }
    .lb-swatch { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; flex-shrink:0; }
    .lb-shoe { display:flex; align-items:center; }
    .lb-shoe-model { font-size:10px; color:#555; margin-left:4px; }
    .lb-time { font-weight:700; font-size:15px; }
    .lb-pace { color:var(--muted); font-size:12px; }
    .lb-date { color:#555; font-size:11px; }
    .lb-pr { font-size:9px; font-weight:700; color:#FBBF24; letter-spacing:1px; margin-left:6px; }
  </style>
</head>

        .map(s => ({
          id: s.id,
          remaining: s.remaining ?? Math.max(0, s.retirement_km - s.total_km),
          weight: s.km_per_week,
          weeklyAlloc: 0,
          weeksToRetire: 0,

      while (pool.length > 0) {

        pool.forEach(s => { s.weeklyAlloc = weeklyKm * (s.weight / totalWeight); });
        pool.forEach(s => { s.weeksToRetire = s.remaining / s.weeklyAlloc; });

        weekOffset += minWeeks;

          </div>
          ${retireLine}
          <div class="life-track"><div class="life-fill" style="width:${pct}%;background:${primary}"></div></div>
          <div class="life-label"><span>${pct}% of ${retKm}km</span><span>${remaining} km left</span></div>
          ${badge}
        </div>`;
    }

    // ── Render main charts ────────────────────────────────────────────────────
    function renderCharts() {
      if (cumChart)     { cumChart.destroy();     cumChart     = null; }
      if (monthlyChart) { monthlyChart.destroy(); monthlyChart = null; }
      if (typeChart)    { typeChart.destroy();    typeChart    = null; }

      cumChart = new Chart(document.getElementById('cumChart'), {
        type: 'line',
        data: {
          labels: months,
          datasets: shoes.map(s => ({
            label: s.model, data: s.cumulative, borderColor: s.color,
            backgroundColor: s.color + '12', borderWidth: s.retired ? 1.5 : 2.5,
            borderDash: s.retired ? [4,3] : [], pointRadius: 0, pointHoverRadius: 5,
            fill: false, tension: 0.4,
          })),
        },
        options: {
          responsive: true,
          interaction: { mode:'index', intersect:false },
          plugins: {
            legend: { labels: { color:'#888', font:{ size:11 }, boxWidth:24, padding:16 } },
            tooltip: { ...tip, callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y} km` } },
          },
          scales: {
            x: { ticks:{ color:tick, font:{ size:10 }, maxRotation:45 }, grid:{ color:grid } },
            y: { ticks:{ color:tick, font:{ size:10 }, callback: v => v+'km' }, grid:{ color:grid } },
          },
        },
      });

      monthlyChart = new Chart(document.getElementById('monthlyChart'), {
        type: 'bar',
        data: {
          labels: weeks,
          datasets: shoes.map(s => ({
            label: s.model, data: s.weekly,
            backgroundColor: s.color + 'cc', borderRadius: 2, borderSkipped: false,
          })),
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: { ...tip, callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y} km` } },
          },
          scales: {
            x: { stacked:true, ticks:{ color:tick, font:{ size:9 }, maxRotation:60, autoSkip:true, maxTicksLimit:24 }, grid:{ color:grid } },
            y: { stacked:true, ticks:{ color:tick, font:{ size:10 }, callback: v => v+'km' }, grid:{ color:grid } },
          },
        },
      });

      const allTypes   = ['Run','Race','Long Run','Workout','TrailRun','Walk','Hike'];
      const typeColors = { Run:'#FC4C02cc', Race:'#EF4444cc', 'Long Run':'#8B5CF6cc', Workout:'#06B6D4cc', TrailRun:'#10B981cc', Walk:'#3d9af1cc', Hike:'#f59e0bcc' };
      typeChart = new Chart(document.getElementById('typeChart'), {
        type: 'bar',
        data: {
          labels: shoes.map(s => s.model),
          datasets: allTypes.map(t => ({
            label: t, data: shoes.map(s => s.types[t] || 0),
            backgroundColor: typeColors[t], borderRadius: 2, borderSkipped: false,
          })),
        },
        options: {
          responsive: true,
          indexAxis: 'y',
          plugins: {
            legend: { labels: { color:'#888', font:{ size:11 }, boxWidth:20, padding:12 } },
            tooltip: { ...tip },
          },
          scales: {
            x: { stacked:true, ticks:{ color:tick, font:{ size:10 } }, grid:{ color:grid } },
            y: { stacked:true, ticks:{ color:tick, font:{ size:10 } }, grid:{ color:grid } },
          },
        },
      });
    }

    // ── Shoe detail overlay ───────────────────────────────────────────────────
    function openShoe(shoeId) {
      const shoe = shoes.find(s => s.id === shoeId);
      if (!shoe) return;

      const retKm     = shoe.retirement_km;
      const pct       = shoe.pct_life;
      const remaining = shoe.remaining ?? Math.max(0, retKm - shoe.total_km);

      // Histogram: 1km buckets 0–10, 2km buckets 10–20, 5km buckets 20–50, then 50+
      const HIST_EDGES = [
        ...Array.from({length: 10}, (_, i) => i),          // 0,1,2,...,9  → 10 buckets of 1km
        ...Array.from({length: 5},  (_, i) => 10 + i * 2), // 10,12,14,16,18 → 5 buckets of 2km
        ...Array.from({length: 6},  (_, i) => 20 + i * 5), // 20,25,30,35,40,45 → 6 buckets of 5km
        50,                                                  // 50+ catch-all
      ]; // 22 edges → 22 buckets (last is open-ended)
      const buckets = new Array(HIST_EDGES.length).fill(0);
      shoe.run_distances.forEach(d => {
        let idx = HIST_EDGES.findIndex((edge, i) => i === HIST_EDGES.length - 1 || d < HIST_EDGES[i + 1]);
        buckets[Math.max(0, idx)]++;
      });
      const histLabels = HIST_EDGES.map((edge, i) =>
        i === HIST_EDGES.length - 1 ? '50+' : `${edge}–${HIST_EDGES[i + 1]}`
      );

      const pieLabels = Object.keys(shoe.types);
      const pieData   = Object.values(shoe.types);

      document.getElementById('overlay-content').innerHTML = `
        <div class="overlay-accent" style="background:repeating-linear-gradient(45deg,${shoe.color},${shoe.color} 8px,${shoe.secondary} 8px,${shoe.secondary} 16px)"></div>
        <div class="overlay-tag">${shoe.brand} · ${shoe.model}</div>
        <div class="overlay-name" style="color:${shoe.color}">${shoe.name}</div>

        <div class="overlay-stats">
          <div class="overlay-stat">
            <div class="overlay-stat-val" style="color:${shoe.color}">${shoe.total_km}</div>
            <div class="overlay-stat-label">Total km</div>
          </div>
          <div class="overlay-stat">
            <div class="overlay-stat-val" style="color:${shoe.secondary}">${shoe.runs}</div>
            <div class="overlay-stat-label">Activities</div>
          </div>
          <div class="overlay-stat">
            <div class="overlay-stat-val" style="color:${shoe.secondary}">${shoe.avg_km}</div>
            <div class="overlay-stat-label">Avg km / run</div>
          </div>
          <div class="overlay-stat">
            <div class="overlay-stat-val" style="color:${shoe.secondary}">${shoe.km_per_week}</div>
            <div class="overlay-stat-label">Avg km / week</div>
          </div>
          <div class="overlay-stat">
            <div class="overlay-stat-val" style="color:${shoe.secondary}">${Math.max(...shoe.run_distances)}</div>
            <div class="overlay-stat-label">Longest run</div>
          </div>
          <div class="overlay-stat">
            <div class="overlay-stat-val" style="color:${shoe.secondary}">${(() => { const d = new Date(shoe.last_run_iso); const diff = Math.floor((Date.now() - d) / 86400000); return diff === 0 ? 'Today' : diff + 'd ago'; })()}</div>
            <div class="overlay-stat-label">Last used</div>
          </div>
          <div class="overlay-stat">
            <div class="overlay-stat-val" style="color:${shoe.secondary}">${shoe.first_run}</div>
            <div class="overlay-stat-label">First run</div>
          </div>
          <div class="overlay-stat">
            <div class="overlay-stat-val" style="color:${shoe.secondary}">${shoe.last_run}</div>
            <div class="overlay-stat-label">Last run</div>
          </div>
        </div>

        <div class="overlay-life-section">
          <div class="overlay-life-header">
            <span class="overlay-life-pct" id="overlay-pct-label">${pct}% of ${retKm}km retirement distance</span>
          </div>
          <div class="life-track">
            <div class="life-fill" id="overlay-life-fill" style="width:${pct}%;background:${shoe.color}"></div>
          </div>
          <div class="life-label" style="margin-top:8px">
            <span id="overlay-pct-right">${pct}%</span>
            <span id="overlay-remaining">${remaining} km left</span>
          </div>
        </div>

        <div class="overlay-charts">
          <div class="chart-block">
            <h3>Run distance distribution</h3>
            <canvas id="overlayHist"></canvas>
          </div>
          <div class="chart-block">
            <h3>Activity types</h3>
            <canvas id="overlayPie"></canvas>
          </div>
        </div>
        ${shoe.best_efforts && Object.keys(shoe.best_efforts).length > 0 ? `
        <div class="overlay-prs">
          <h3>Personal Records on this shoe</h3>
          <div class="pr-grid">
            ${DISTANCE_ORDER.filter(d => shoe.best_efforts[d]).map(d => {
              const pr = shoe.best_efforts[d];
              return '<div class="pr-card' + (pr.is_overall_pr ? ' pr-overall' : '') + '">' +
                '<div class="pr-dist">' + d + '</div>' +
                '<div class="pr-time" style="color:' + shoe.color + '">' + pr.time_str + '</div>' +
                '<div class="pr-pace">' + pr.pace_str + '</div>' +
                '<div class="pr-date">' + pr.date + '</div>' +
                (pr.is_overall_pr ? '<div class="pr-badge">PR</div>' : '') +
                '</div>';
            }).join('')}
          </div>
        </div>` : ''}
        ${(speedPoints.pts?.[shoe.id] || 0) > 0 ? (() => {
          const totalPts = speedPoints.pts[shoe.id];
          const chips = Object.entries(speedPoints.breakdown[shoe.id])
            .sort(([,a],[,b]) => a.rank - b.rank)
            .map(([dist, info]) =>
              '<div class="pts-chip">' +
              '<div class="pts-chip-dist">' + dist + '</div>' +
              '<div><span class="pts-chip-val">+' + info.pts + ' pts</span><span class="pts-chip-rank"> · #' + info.rank + '</span></div>' +
              '</div>'
            ).join('');
          return '<div class="overlay-pts"><h3>Speed points</h3><div class="pts-total">' + totalPts + ' pts</div><div class="pts-breakdown">' + chips + '</div></div>';
        })() : ''}
      `;

      if (histChart) { histChart.destroy(); histChart = null; }
      if (pieChart)  { pieChart.destroy();  pieChart  = null; }

      histChart = new Chart(document.getElementById('overlayHist'), {
        type: 'bar',
        data: {
          labels: histLabels,
          datasets: [{ label:'Runs', data: buckets, backgroundColor: shoe.color + 'bb', borderRadius:3, borderSkipped:false }],
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display:false },
            tooltip: { ...tip, callbacks: { label: c => ` ${c.parsed.y} run${c.parsed.y !== 1 ? 's' : ''}` } },
          },
          scales: {
            x: { ticks:{ color:tick, font:{ size:10 }, maxRotation:60 }, grid:{ color:grid } },
            y: { ticks:{ color:tick, font:{ size:10 }, stepSize:1 }, grid:{ color:grid } },
          },
        },
      });

      const pieColorMap = {
        Run:'#FC4C02', Race:'#EF4444', 'Long Run':'#8B5CF6', Workout:'#06B6D4',
        TrailRun:'#10B981', Walk:'#3d9af1', Hike:'#f59e0b',
        VirtualRun:'#8B5CF6', NordicSki:'#34D399',
      };
      pieChart = new Chart(document.getElementById('overlayPie'), {
        type: 'doughnut',
        data: {
          labels: pieLabels,
          datasets: [{
            data: pieData,
            backgroundColor: pieLabels.map(l => (pieColorMap[l] || '#888') + 'dd'),
            borderColor: '#1c1c22', borderWidth:2, hoverOffset:8,
          }],
        },
        options: {
          responsive: true,
          plugins: {
            legend: { labels: { color:'#888', font:{ size:11 }, padding:16 } },
            tooltip: { ...tip },
          },
        },
      });

      document.getElementById('overlay').style.display = 'block';
      document.body.style.overflow = 'hidden';
      window.scrollTo(0, 0);
    }

    function closeShoe() {
      document.getElementById('overlay').style.display = 'none';
      document.body.style.overflow = '';
    }

    // ── Escape key closes overlay ─────────────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.getElementById('overlay').style.display !== 'none') {
        closeShoe();
      }
    });

    // ── Boot ──────────────────────────────────────────────────────────────────
    loadDashboard();
  </script>
</body>
</html>
